<html>
<head>
<meta charset="utf-8">
<title>Solitaire</title>
<style>
    body { font-family: sans-serif; margin: 16px; }
    #wrap { position: relative; display: inline-block; }
    #buttons { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 100; display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
    #moves { display: flex; flex-wrap: wrap; gap: 4px 8px; }
    button { font-size: 18px; padding: 6px 16px; }
</style>
</head>
<body>
    <div id="wrap">
        <div id="table"></div>
        <div id="buttons">
            <div id="moves"></div>
            <button id="new">New deal</button>
        </div>
    </div>

        const fs = typeof require !== 'undefined' ? require('fs') : null

        var test = false;

        if (typeof process !== 'undefined' && process.argv[2]!==undefined) test = true;

        const keypress = async () => {
        process.stdin.setRawMode(true)
        return new Promise(resolve => process.stdin.once('data', () => {
            process.stdin.setRawMode(false)
            resolve()
        }))
        }

        stock = []
        waste = []
        build = []
        suits = []

        cardDisplay = function(array){
            var display = array.map(x => x.u ? " A23456789TJQK"[x.r] + "hcds"[x.s] : "--").join(' ')
            return display
        }

        show = function(){
            console.log("stock    "+cardDisplay(stock))
            console.log("waste    "+cardDisplay(waste))
            console.log('------------------------------------------------')
            for (n=0; n<7; n++) {
                console.log("build["+n+"] "+cardDisplay(build[n]))
            }
            console.log('------------------------------------------------')
            for (n=0; n<4; n++) {
                console.log("suits["+n+"] "+cardDisplay(suits[n]))
            }
            console.log();

        }

}

        cardDisplayHTML = function(card, offset = 0){
            var pos = 'position:absolute;top:' + offset + 'px;left:0;'
            if (card === undefined) return '<div class="card empty" style="' + pos + '"></div>'
            var src = card.u
                ? cardImages[['heart','club','diamond','spade'][card.s] + '/' + card.r]
                : cardImages['back']
            return '<img class="card" style="' + pos + '" src="' + src + '">'
        }

        showHTML = function(){
            var style = '<style>' +
                '.solitaire{font-family:sans-serif;display:inline-block;background:#0a6b2f;padding:12px}' +
                '.solitaire .row{display:flex;gap:8px;margin-bottom:16px}' +
                '.solitaire .pile{position:relative;width:100px;height:144px}' +
                '.solitaire .build{height:745px}' +
                '.solitaire .card{display:block;width:100px;height:144px}' +
                '.solitaire .card.empty{box-sizing:border-box;border:1px dashed #9c9;border-radius:6px}' +
                '.solitaire .count{position:absolute;top:0;left:0;width:100px;height:144px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:bold;color:#fff;text-shadow:0 0 4px #000,0 0 4px #000}' +
                '.solitaire .gap{width:100px}' +
                '</style>'

            // piles are stored top card first, so draw from the back to put the top card last (on top)
            var pile = function(array, cls, spread, count = 0){
                var cards = array.length == 0 ? [undefined] : array.slice().reverse()
                return '<div class="pile ' + cls + '">' +
                    cards.map((c, i) => cardDisplayHTML(c, spread ? i * 40 : 0)).join('') +
                    (count > 0 ? '<span class="count">' + count + '</span>' : '') +
                    '</div>'
            }

            var html = '<div class="solitaire">' + style
            html += '<div class="row">' +
                pile(stock.slice(0, 1), 'stock', false, stock.length) +
                pile(waste.slice(0, 1), 'waste', false) +
                '<div class="gap"></div>' +
                suits.map(s => pile(s.slice(0, 1), 'suit', false)).join('') +
                '</div>'
            html += '<div class="row">' + build.map(b => pile(b, 'build', true)).join('') + '</div>'
            html += '</div>'
            return html
        }

        writeHTML = function(){
            fs.writeFileSync(__dirname + '/table.html', '<meta http-equiv="refresh" content="1">' + showHTML())
        }

        result = function(){
            var totalSuits = 0;
            for (i = 0; i < 4; i++){
                if (suits[i].length > 0){
                    totalSuits += suits[i][0].r
                }
            }
            return totalSuits
        }

        deal = function(){
            sequence = Array.from({ length: 52 }, (_, index) => index);
            for (i=0; i<sequence.length-1; i++){
                j = i + Math.floor(Math.random() * (sequence.length - i))
                temp = sequence[i]
                sequence[i] = sequence[j]
                sequence[j] = temp
            }

            next = 0;
            for (n=0; n<7; n++) {
                build[n] = []
                for (m=0; m<n+1; m++) {
                    build[n][m] = {r:sequence[next]%13 + 1,s:Math.floor(sequence[next]/13),u:m==0}
                    next++
                }
            }

            for (n=0; n<4; n++) suits[n] = []

            for (n=0; n<24; n++) stock[n] = {r:sequence[next+n]%13 + 1,s:Math.floor(sequence[next+n]/13),u:false}

            waste = []
        }

        move = function(from,to,head=0){
            to.unshift(...from.splice(0,head+1))  
        }  

        order = function(build){ // order build columns by number of downcards desc
            return build.map((x,i) => [i,x.reduce((a,c)=>a+(c.u?0:1),0)]).sort((a,b) => b[1]-a[1]).map(([a,b])=>a)
        }

        numdown = function(build){
            return build.map(x => x.reduce((a,c)=>a+(c.u?0:1),0))
        }

        numgap = function(build){ 
            return build.filter(c=>c.length==0).length
        }

        const MoveBuildToBuild = 0, MoveBuildToBuildPartial = 1, MoveBuildToSuitsExpose = 2, MoveWasteToBuild = 3,
            MoveWasteToSuits = 4, MoveSuitsToBuild = 5, MoveBuildToSuits = 6, MoveTurnStock = 7
        const moveNames = ['build to build', 'build to build (partial)', 'build to suits and expose', 'waste to build',
                        'waste to suits', 'suits to build', 'build to suits', 'turn card']

        // moveType, fromPile (build 0-6, suits 0-3, -1 for waste/stock), toPile, cardIndex (head of the stack moved)
        Move = function(moveType, fromPile, toPile, cardIndex = 0){
            return {moveType, fromPile, toPile, cardIndex}
        }

        // returns every available move, best first
        possibleMoves = function(){
            var moves = []

            // build to build (full)
            var o = order(build);
            for (i = 0; i < 7; i++){
                if (build[o[i]].length > 0) {
                    var head = 0;
                    for (n = 0; n < build[o[i]].length; n++){
                        if (build[o[i]][n].u == false){
                            head = n-1;
                            break;
                        }
                        if ((n == build[o[i]].length - 1) &&  (build[o[i]][n].u == true)) head = n;
                    }
                    for (j = 0; j < 7; j++){
                        if (build[j].length == 0 && build[o[i]][head].r == 13 && head < build[o[i]].length - 1){
                            moves.push(Move(MoveBuildToBuild, o[i], j, head))
                        }
                        if (build[j].length > 0 && (build[o[i]][head].r +  1 == build[j][0].r) && (build[o[i]][head].s + build[j][0].s)%2 == 1) {  
                            if (numdown(build)[o[i]]>0 || numgap(build)==0){ // don't vacate space unless to expose a downcard or there is no gap
                                moves.push(Move(MoveBuildToBuild, o[i], j, head))
                            }
                        }
                    }
                }
            }  
            
            // build to suits and expose
            for (i = 0; i < 7; i++){
                if (build[i].length > 1 && build[i][1].u == false && build[i][0].r == 1) {
                    moves.push(Move(MoveBuildToSuitsExpose, i, build[i][0].s))
                }
                if (build[i].length > 1 && build[i][1].u == false && suits[build[i][0].s][0]?.r + 1 == build[i][0].r) {
                    moves.push(Move(MoveBuildToSuitsExpose, i, build[i][0].s))
                }
            }

            // waste to build
            if (waste.length > 0){
                for (i = 0; i < 7; i++){
                    if (build[6-o[i]].length > 0 && waste[0].r > 1 && (waste[0].r +  1 == build[6-o[i]][0].r) && (waste[0].s + build[6-o[i]][0].s)%2 == 1) {
                        moves.push(Move(MoveWasteToBuild, -1, 6-o[i]))
                    } else if (waste[0].r == 13 && build[6-o[i]].length == 0) {
                        moves.push(Move(MoveWasteToBuild, -1, 6-o[i]))
                    }                         
                }
            }

            // waste to suits
            if (waste.length > 0){
                if (waste[0].r == 1) {
                    moves.push(Move(MoveWasteToSuits, -1, waste[0].s))
                } else if ((suits[waste[0].s][0])?.r == (waste[0].r - 1)) {
                    moves.push(Move(MoveWasteToSuits, -1, waste[0].s))
                }
            }

            // Worry down (suits to build to enable waste card placement)
            if (waste.length > 0){
                for (i = 0; i < 7; i++){
                    if (build[i].length > 0 && waste[0].r + 2 == build[i][0].r && (waste[0].s + build[i][0].s)%2 == 0) {
                        for (j = 0; j < 4; j++){
                            if (suits[j].length > 0 &&
                                suits[j][0].r + 1 == build[i][0].r &&
                                (suits[j][0].s + build[i][0].s)%2 == 1
                            ) {
                                moves.push(Move(MoveSuitsToBuild, j, i))
                            }
                        }
                    }
                }
            }

            // Double worry down (suits to build to enable waste card placement)
            if (waste.length > 0){
                for (i = 0; i < 7; i++){
                    if (build[i].length > 0 && waste[0].r + 3 == build[i][0].r && (waste[0].s + build[i][0].s)%2 == 1) {
                        for (j = 0; j < 4; j++){
                            if (suits[j].length > 0 &&
                                suits[j][0].r + 2 == build[i][0].r &&
                                (suits[j][0].s + build[i][0].s)%2 == 0
                            ) {
                                for (k = 0; k < 4; k++){
                                    if (suits[k].length > 0 &&
                                        suits[k][0].r + 1 == build[i][0].r &&
                                        (suits[k][0].s + build[i][0].s)%2 == 1
                                    ) {
                                        moves.push(Move(MoveSuitsToBuild, k, i))
                                    }
                                }
                            }
                        }
                    }
                }
            }

            // build to suits
            for (i = 0; i < 7; i++){
                if (!(build[i].length > 1 && build[i][1].u == false && build[i][0].r == 1)) { // not b to s expose
                    if (build[i].length > 0 && build[i][0].r == 1) {
                        moves.push(Move(MoveBuildToSuits, i, build[i][0].s))
                    } 
                }
                if (!(build[i].length > 1 && build[i][1].u == false && suits[build[i][0].s][0]?.r + 1 == build[i][0].r)) {
                    if (build[i].length > 0 && suits[build[i][0].s][0]?.r + 1 == build[i][0].r) { 
                        moves.push(Move(MoveBuildToSuits, i, build[i][0].s))
                    } 
                }

            } 

            // build to build (partial)
            for (i = 0; i < 7; i++){
                if (build[i].length > 0) {
                    for (j = 0; j < 7; j++){
                        if (build[j].length > 0) {                
                            for (n = 1; n < build[j].length; n++){
                                if (build[j][n].u == true &&
                                    build[j][n].r == suits[build[j][n].s][0]?.r + 1 &&
                                    build[i][0].r != suits[build[i][0].s][0]?.r + 1 &&
                                    build[i][0].r == build[j][n].r &&
                                    build[i][0].s == (build[j][n].s + 2) % 4 
                                ) {
                                    moves.push(Move(MoveBuildToBuildPartial, j, i, n-1))
                                }
                            } 
                        }
                    }
                }
            }

            // turn stock card
            if (stock.length > 0) {
                moves.push(Move(MoveTurnStock, -1, -1))
            }

            return moves
        }

        // execute one move from the list
        doMove = function(m){
            if (test) console.log(moveNames[m.moveType])
            switch (m.moveType) {
                case MoveBuildToBuild:
                case MoveBuildToBuildPartial:
                    move(build[m.fromPile], build[m.toPile], m.cardIndex)
                    break
                case MoveBuildToSuits:
                case MoveBuildToSuitsExpose:
                    move(build[m.fromPile], suits[m.toPile])
                    break
                case MoveWasteToBuild:
                    move(waste, build[m.toPile])
                    break
                case MoveWasteToSuits:
                    move(waste, suits[m.toPile])
                    break
                case MoveSuitsToBuild:
                    move(suits[m.fromPile], build[m.toPile])
                    break
                case MoveTurnStock:
                    move(stock, waste)
                    waste[0].u = true
                    break
            }
            if (m.moveType != MoveSuitsToBuild && m.fromPile >= 0 && build[m.fromPile]?.length > 0) build[m.fromPile][0].u = true
        }

        // play the best available move; returns 1 if a move was made, 0 if none
        step = function(){
            var moves = possibleMoves()
            if (moves.length == 0) return 0
            doMove(moves[0])
            return 1
        }

        if (typeof process === 'undefined') {
            // running in a browser: the page drives the game
        } else if (test) {
            ;(async () => {

                deal()
                writeHTML()
                var next = 1
                while(next){
                    await keypress()
                    next = step()
                    show()
                    writeHTML()
                }

            })().then(process.exit)
        } else {
            var total = 0, out = 0
            distribution = Array.from({ length: 53 }, (_, index) => 0);

            for (count = 0; count < 1000000; count++){
                deal()
                while(step() == 1){}

                handresult = result()
                total += handresult
                if (handresult==52) out++
                distribution[handresult]++

            }
            console.log(total/1000000.0)
            console.log(out/1000000.0)
            console.log(distribution)
        }

        var tableDiv = document.getElementById('table')
        var movesDiv = document.getElementById('moves')

        function cardLabel(card) {
            return " A23456789TJQK"[card.r].replace('T', '10') + "♥♣♦♠"[card.s]
        }

        // describe a move as "from card -> to card"
        function moveLabel(m) {
            var from, to
            if (m.moveType == MoveTurnStock) return 'Turn stock card'
            if (m.fromPile == -1) from = cardLabel(waste[0])
            else if (m.moveType == MoveSuitsToBuild) from = cardLabel(suits[m.fromPile][0])
            else from = cardLabel(build[m.fromPile][m.cardIndex])

            if (m.moveType == MoveBuildToSuits || m.moveType == MoveBuildToSuitsExpose || m.moveType == MoveWasteToSuits) {
                to = suits[m.toPile].length > 0 ? cardLabel(suits[m.toPile][0]) : 'suit'
            } else {
                to = build[m.toPile].length > 0 ? cardLabel(build[m.toPile][0]) : 'build'
            }
            return from + ' \u2192 ' + to
        }

        function render() {
            tableDiv.innerHTML = showHTML()
            movesDiv.innerHTML = ''
            var moves = possibleMoves()
            if (moves.length == 0) movesDiv.textContent = ''
            moves.forEach(function (m) {
                var b = document.createElement('button')
                b.textContent = moveLabel(m)
                b.onclick = function () {
                    doMove(m)
                    render()
                }
                movesDiv.appendChild(b)
            })
        }

        function newDeal() {
            deal()
            render()
        }

        document.getElementById('new').onclick = newDeal

        newDeal()
    </script>
