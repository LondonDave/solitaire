<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Solitaire</title>
<style>
    body { font-family: sans-serif; margin: 16px; }
    #wrap { position: relative; display: inline-block; }
    #buttons { position: absolute; left: 12px; bottom: 12px; z-index: 100; display: flex; gap: 8px; }
    button { font-size: 18px; padding: 6px 16px; }
</style>
</head>
<body>
    <div id="wrap">
        <div id="table"></div>
        <div id="buttons">
            <button id="next">Next move</button>
            <button id="new">New deal</button>
        </div>
    </div>

    <script src="lvs.js"></script>
    <script>
        var tableDiv = document.getElementById('table')
        var nextButton = document.getElementById('next')

        function render() {
            tableDiv.innerHTML = showHTML()
        }

        function newDeal() {
            deal()
            nextButton.disabled = false
            render()
        }

        nextButton.onclick = function () {
            if (possibleMoves() == 0) nextButton.disabled = true
            render()
        }
        document.getElementById('new').onclick = newDeal

        newDeal()
    </script>
</body>
</html>
