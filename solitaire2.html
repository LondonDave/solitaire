<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Solitaire</title>
<style>
    body { font-family: sans-serif; margin: 16px; }
    #wrap { position: relative; display: inline-block; }
    #buttons { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 100; display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
    #moves { display: flex; flex-wrap: wrap; gap: 4px 8px; }
    button { font-size: 18px; padding: 6px 16px; }
</style>
</head>
<body>
    <div id="wrap">
        <div id="table"></div>
        <div id="buttons">
            <div id="moves"></div>
            <button id="new">New deal</button>
        </div>
    </div>

    <script src="lvs.js"></script>
    <script>
        var tableDiv = document.getElementById('table')
        var movesDiv = document.getElementById('moves')

        function cardLabel(card) {
            return " A23456789TJQK"[card.r].replace('T', '10') + "♥♣♦♠"[card.s]
        }

        // describe a move as "from card -> to card"
        function moveLabel(m) {
            var from, to
            if (m.moveType == MoveTurnStock) return 'Turn stock card'
            if (m.fromPile == -1) from = cardLabel(waste[0])
            else if (m.moveType == MoveSuitsToBuild) from = cardLabel(suits[m.fromPile][0])
            else from = cardLabel(build[m.fromPile][m.cardIndex])

            if (m.moveType == MoveBuildToSuits || m.moveType == MoveBuildToSuitsExpose || m.moveType == MoveWasteToSuits) {
                to = suits[m.toPile].length > 0 ? cardLabel(suits[m.toPile][0]) : 'suit'
            } else {
                to = build[m.toPile].length > 0 ? cardLabel(build[m.toPile][0]) : 'build'
            }
            return from + ' \u2192 ' + to
        }

        function render() {
            tableDiv.innerHTML = showHTML()
            movesDiv.innerHTML = ''
            var moves = possibleMoves()
            if (moves.length == 0) movesDiv.textContent = ''
            moves.forEach(function (m) {
                var b = document.createElement('button')
                b.textContent = moveLabel(m)
                b.onclick = function () {
                    doMove(m)
                    render()
                }
                movesDiv.appendChild(b)
            })
        }

        function newDeal() {
            deal()
            render()
        }

        document.getElementById('new').onclick = newDeal

        newDeal()
    </script>
</body>
</html>
